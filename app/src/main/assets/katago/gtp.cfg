# Lightweight Android KataGo 9x9 GTP configuration
# Scoring Chinese area, komi=7.0 is also set per analyzed position.
logAllGTPCommunication = false
logSearchInfo = false
logToStderr = true
ponderingEnabled = false
# KataGo defaults to no resignation. Setting allowResignation requires resignThreshold.
reportAnalysisWinratesAs = SIDETOMOVE
numSearchThreads = 2
numNNServerThreadsPerModel = 1
nnMaxBatchSize = 1
nnCacheSizePowerOfTwo = 13
mutexPoolSize = 8192
maxVisits = 200
maxTime = 20
analysisPVLen = 1
koRule = SIMPLE
scoringRule = AREA
taxRule = NONE
multiStoneSuicideLegal = false
hasButton = false
whiteHandicapBonus = N
