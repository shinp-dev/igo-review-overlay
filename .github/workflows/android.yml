name: Android CI
on:
  push:
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test bridge compatibility
        run: python -m unittest discover -s bridge -p "test_*.py" -v
      - name: Build offline APK from a fresh checkout (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Build offline APK from a fresh checkout (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: gradlew.bat :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Verify offline APK contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          with ZipFile(apk) as z:
              for name, expected in [
                  ("model.bin.gz.asset", "f57fddf4672364d385d6ab177364ab819810d1123e229cb2649c4f337a2160b1"),
                  ("kata9x9.bin.gz.asset", "a1298ce1adc1dad7bd868ca962b2384cc8388ed373a00e6bae1114fa6f9e2d61"),
              ]:
                  assert hashlib.sha256(z.read("assets/katago/" + name)).hexdigest() == expected, name
              engine = z.read("lib/arm64-v8a/libkatago.so")
              expected_engine = Path("third_party/KataGo.arm64.sha256").read_text().strip()
              assert hashlib.sha256(engine).hexdigest() == expected_engine
              assert engine[:6] == b"\x7fELF\x02\x01" and engine[18:20] == b"\xb7\x00"
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ runner.os == 'Linux' && 'igo-review-overlay-offline-debug-apk' || 'igo-review-overlay-windows-debug-apk' }}
          path: app/build/outputs/apk/debug/app-debug.apk
