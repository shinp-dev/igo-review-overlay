name: Vendor KataGo (one-time)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-katago.yml'
      - 'tools/vendor_katago.py'
permissions:
  contents: write
concurrency:
  group: vendor-katago-main
  cancel-in-progress: false
jobs:
  vendor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check if already vendored
        id: state
        run: |
          if test -f third_party/KataGo.arm64.sha256; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.state.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.state.outputs.needed == 'true'
        with:
          packages: 'platform-tools'
      - name: Build pinned KataGo and retrieve verified models once
        if: steps.state.outputs.needed == 'true'
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          ./gradlew --no-daemon :app:prepareKataGo
          python tools/vendor_katago.py
      - name: Test local-only engine preparation and APK contents
        if: steps.state.outputs.needed == 'true'
        run: |
          rm -rf .native-build
          rm -f app/src/main/assets/katago/*.bin.gz.asset
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          engine = Path("app/src/main/jniLibs/arm64-v8a/libkatago.so").read_bytes()
          assert hashlib.sha256(engine).hexdigest() == Path("third_party/KataGo.arm64.sha256").read_text().strip()
          with ZipFile("app/build/outputs/apk/debug/app-debug.apk") as apk:
              assert apk.read("lib/arm64-v8a/libkatago.so") == engine
              for name, sha in [
                  ("model.bin.gz.asset", "f57fddf4672364d385d6ab177364ab819810d1123e229cb2649c4f337a2160b1"),
                  ("kata9x9.bin.gz.asset", "a1298ce1adc1dad7bd868ca962b2384cc8388ed373a00e6bae1114fa6f9e2d61"),
              ]:
                  assert hashlib.sha256(apk.read("assets/katago/" + name)).hexdigest() == sha
          assert not Path(".native-build").exists()
          PY
          python -m unittest discover -s bridge -p "test_*.py" -v
      - name: Commit verified source, engine and model chunks
        if: steps.state.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add .gitattributes third_party/KataGo.REVISION third_party/Eigen.REVISION third_party/KataGo.arm64.sha256
          git add -f third_party/KataGo third_party/Eigen third_party/KataGo-models app/src/main/jniLibs/arm64-v8a/libkatago.so
          git diff --cached --stat | tail -n 5
          git commit -m "Vendor KataGo ARM64, corresponding sources and both verified networks"
          git push origin HEAD:main
